services:
  - type: web
    name: logic-simulator-broker-staging
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: false
    dockerfilePath: ./validation/api_anbindung/backend-sandbox/Dockerfile
    dockerContext: ./validation/api_anbindung/backend-sandbox
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: ALLOWED_ORIGINS
        sync: false
      - key: STAGING_ACCESS_TOKEN
        sync: false
