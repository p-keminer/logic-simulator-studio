name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Test, Build, Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Run quality gates
        run: ./scripts/ci/run_quality_gates.sh

  broker-quality-gates:
    name: Broker Test, Typecheck, Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: broker/package-lock.json

      - name: Install broker dependencies
        run: npm ci
        working-directory: broker

      - name: Audit broker dependencies
        run: npm audit --audit-level=high
        working-directory: broker

      - name: Typecheck broker
        run: npm run typecheck
        working-directory: broker

      - name: Test broker
        run: npm test
        working-directory: broker

      - name: Build broker
        run: npm run build
        working-directory: broker

      - name: Verify source-only production build
        run: |
          test -f dist/app/server.js
          test ! -d dist/src
          test ! -d dist/tests
        working-directory: broker

  contract-runner:
    name: Contract Runner v1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - quality-gates

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run contract runner
        run: ./scripts/ci/run_contract_runner.sh

      - name: Upload contract-runner artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-runner
          path: |
            .artifacts/validation/contract-runner/summary.json
            .artifacts/validation/contract-runner/report.md

  golden-corpus:
    name: Golden Corpus v1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - quality-gates

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog ghdl yosys verilator

      - name: Run golden corpus runner
        run: ./scripts/ci/run_golden_corpus.sh

      - name: Upload golden-corpus artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-corpus
          path: |
            .artifacts/validation/golden-corpus/summary.json
            .artifacts/validation/golden-corpus/report.md

  focused-nine-ui:
    name: Focused-Nine UI Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - quality-gates

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused-nine UI audit
        run: ./scripts/ci/run_focused_nine_ui.sh

      - name: Upload focused-nine-ui artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: focused-nine-ui
          path: |
            .artifacts/validation/focused-nine-ui/

  focused-nine-core:
    name: Focused-Nine Core Regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - quality-gates

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog ghdl yosys verilator

      - name: Run focused-nine core audit
        run: ./scripts/ci/run_focused_nine_core.sh

      - name: Upload focused-nine artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: focused-nine-core
          path: |
            .artifacts/validation/focused-nine/

  hdl-toolchain:
    name: HDL Toolchain Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog ghdl yosys verilator

      - name: Verify HDL toolchain
        run: ./scripts/ci/check_hdl_toolchain.sh
